# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.typescript-sdk]
source = "dagger.io/sdk/typescript@main"

[sdks.typescript]
module = "typescript-sdk"

[modules.hello]
source = ".dagger/modules/hello"

[sdks.typescript.scopes.".dagger/modules/hello"]
is-module = true
name = "hello"

[modules.version-hello]
source = ".dagger/modules/version-hello"

[sdks.typescript.scopes.".dagger/modules/version-hello"]
is-module = true
name = "version-hello"
