# Dagger workspace configuration
# Install modules with: dagger module install <module>
# Example:
#   dagger module install dagger.io/linux/wolfi

[modules]

[modules.go-sdk]
source = "dagger.io/sdk/go"

[sdks.go]
module = "go-sdk"

[modules.fixtures]
source = ".dagger/modules/fixtures"

[sdks.go.scopes.".dagger/modules/fixtures"]
is-module = true
name = "fixtures"

[sdks.go.scopes."."]
name = "native-tests"
clients = ["./.dagger/modules/fixtures"]
